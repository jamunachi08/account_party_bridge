[project]
name = "account_party_bridge"
authors = [
    { name = "Your Company", email = "you@example.com" }
]
description = "Mirror Chart of Accounts Receivable/Payable nodes into Customer/Supplier masters, driven by a user-editable field map."
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<16.0.0"
erpnext = ">=15.0.0,<16.0.0"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "RUF"]
ignore = ["B017", "B023", "B904", "E101", "E501", "F401", "W191"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
